name: Feature request
description: Something the console should do but doesn't
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do as an operator that you can't today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you imagine it working. Optional.
  - type: input
    id: prior-art
    attributes:
      label: Prior art
      description: Does another tool (Headplane, Tailscale admin, etc.) do this well?
