name: Deploy docs

# Runs on every push to main, not just docs/** changes: the docs site also
# publishes version.json (see the "Write version.json" step below), the
# public, unauthenticated source the app's in-app update check reads from
# (the app repo is private, so it can't safely call the GitHub API itself -
# see @/lib/version). That file needs to stay current with every commit, not
# just docs edits.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: docs/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: Write version.json
        run: |
          version=$(node -p "require('./package.json').version")
          sha="${{ github.sha }}"
          published_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          printf '{"version":"%s","sha":"%s","publishedAt":"%s"}\n' \
            "$version" "$sha" "$published_at" > docs/public/version.json

      - name: Build (static export)
        working-directory: docs
        run: pnpm build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
