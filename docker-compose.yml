services:
  headtower:
    build:
      context: .
      args:
        # Sub-path mount, e.g. HEADTOWER_BASE_PATH=/admin (from .env).
        HEADTOWER_BASE_PATH: "${HEADTOWER_BASE_PATH:-}"
    container_name: headtower
    restart: unless-stopped
    ports:
      # HOST bind:port -> container's 3000. Override HEADTOWER_BIND (e.g. in a
      # .env file) to reuse an existing port or bind to localhost behind a proxy,
      # e.g. HEADTOWER_BIND=127.0.0.1:3001
      - "${HEADTOWER_BIND:-0.0.0.0:3000}:3000"
    volumes:
      # Local store: your Headscale connection, OIDC config, sessions, audit log.
      - headtower-data:/app/data
    extra_hosts:
      # Lets the container reach a Headscale running on the host (e.g. :8080).
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=production
      # Runtime base path (mirrors the build arg) so server-side URL building -
      # e.g. the OIDC redirect_uri - knows the /admin sub-path mount.
      - HEADTOWER_BASE_PATH=${HEADTOWER_BASE_PATH:-}
      # Core connection - set these in .env and it connects on boot, skipping
      # the setup wizard. Everything else is configured in the Settings panel.
      - HEADSCALE_URL=${HEADSCALE_URL:-}
      - HEADSCALE_API_KEY=${HEADSCALE_API_KEY:-}
      # OIDC/SSO session signing (optional; configure OIDC itself in Settings).
      - HEADTOWER_SESSION_SECRET=${HEADTOWER_SESSION_SECRET:-}
      # Optional: encrypts secrets stored in the DB at rest.
      - HEADTOWER_SECRET=${HEADTOWER_SECRET:-}
      # Optional agent (device metadata + browser SSH). Reach it in-cluster at
      # http://agent:8410 (set HEADTOWER_AGENT_URL in .env when you enable the
      # agent profile below); the SSH secret must match the agent service's.
      - HEADTOWER_AGENT_URL=${HEADTOWER_AGENT_URL:-}
      - HEADTOWER_AGENT_SSH_SECRET=${HEADTOWER_AGENT_SSH_SECRET:-}
      # Must match the agent's hostname so the app hides the agent's own node.
      - HEADTOWER_AGENT_HOSTNAME=${HEADTOWER_AGENT_HOSTNAME:-headtower-agent}
    healthcheck:
      # Node is in the runner image; the root path 307-redirects when healthy.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000'+(process.env.HEADTOWER_BASE_PATH||'')).then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Optional sidecar: joins the tailnet (tsnet) to report device OS/version/
  # endpoints the Headscale API lacks, and to proxy browser SSH to nodes. It is
  # OFF by default (a plain `docker compose up -d` runs only the app); enable it
  # with `docker compose --profile agent up -d` after setting, in .env:
  #   HEADTOWER_AGENT_AUTHKEY        a Headscale pre-auth key
  #   HEADTOWER_AGENT_LOGIN_SERVER   your Headscale URL (required)
  #   HEADTOWER_AGENT_URL=http://agent:8410  (so the app can reach it)
  agent:
    profiles: ["agent"]
    build: ./agent
    container_name: headtower-agent
    restart: unless-stopped
    ports:
      # Browser-SSH websocket target (nginx maps /admin/agent/ -> here).
      - "127.0.0.1:8410:8410"
    volumes:
      - headtower-agent-state:/state
    environment:
      - HEADTOWER_AGENT_LOGIN_SERVER=${HEADTOWER_AGENT_LOGIN_SERVER:-}
      - HEADTOWER_AGENT_AUTHKEY=${HEADTOWER_AGENT_AUTHKEY:-}
      - HEADTOWER_AGENT_HOSTNAME=${HEADTOWER_AGENT_HOSTNAME:-headtower-agent}
      - HEADTOWER_AGENT_SSH_SECRET=${HEADTOWER_AGENT_SSH_SECRET:-}

volumes:
  headtower-data:
  headtower-agent-state:
