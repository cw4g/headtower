services:
  headtower:
    build:
      context: .
      args:
        # Sub-path mount, e.g. HEADTOWER_BASE_PATH=/admin (from .env).
        HEADTOWER_BASE_PATH: "${HEADTOWER_BASE_PATH:-}"
    container_name: headtower
    restart: unless-stopped
    ports:
      # HOST bind:port -> container's 3000. Override HEADTOWER_BIND (e.g. in a
      # .env file) to reuse an existing port or bind to localhost behind a proxy,
      # e.g. HEADTOWER_BIND=127.0.0.1:3001
      - "${HEADTOWER_BIND:-0.0.0.0:3000}:3000"
    volumes:
      # Local store: your Headscale connection, OIDC config, sessions, audit log.
      - headtower-data:/app/data
    environment:
      - NODE_ENV=production
      # Everything below is OPTIONAL - configure Headscale + OIDC from the
      # in-app setup wizard instead. Set them here only if you prefer declarative
      # config or if you enable OIDC (which needs a session secret).
      # - HEADSCALE_URL=https://hs.example.com
      # - HEADSCALE_API_KEY=your-headscale-api-key
      # - HEADTOWER_SESSION_SECRET=change-me-to-32+-random-chars   # required only for OIDC
      # - HEADTOWER_SECRET=optional-encrypts-the-stored-api-key-at-rest

volumes:
  headtower-data:
